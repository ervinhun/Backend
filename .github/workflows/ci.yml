name: CI

# Adapted from docs/ci-cd/backend-ci-cd in the Final project repo.
# Tests need Docker (they start a Postgres container with Testcontainers),
# which ubuntu-latest provides. Set RUN_TESTS to 'false' to skip tests and coverage.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

env:
  RUN_TESTS: 'true'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        if: env.RUN_TESTS == 'true'
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Install ReportGenerator
        if: env.RUN_TESTS == 'true'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.3.9

      - name: Merge coverage report & post summary
        if: env.RUN_TESTS == 'true'
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura;Html"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

  # The build rewrites openapi/FridgeFriend.json; the app's API client is generated from it.
  # Building runs the project's code and packages, so it stays read-only and a
  # separate job, which builds nothing, does the commit. Fork PRs are skipped
  # because the token can't push to them; the next PR from this repo catches up.
  generate-openapi:
    name: Generate the OpenAPI document
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Api/Api.csproj --configuration Release

      - name: Upload the OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi/FridgeFriend.json
          retention-days: 1

  commit-openapi:
    name: Commit the OpenAPI document if it changed
    needs: generate-openapi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Download the OpenAPI document
        uses: actions/download-artifact@v8
        with:
          name: openapi
          path: openapi

      # Pushing the built commit only fast-forwards, so if the branch has moved
      # on this fails and the run for the newer commit regenerates the file.
      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git add openapi/
          if git diff --cached --quiet; then
            echo "openapi/FridgeFriend.json is up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: regenerate the OpenAPI document'
          git push origin "HEAD:refs/heads/$HEAD_REF"

  docker-build-check:
    name: Confirm the Docker image still builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
