name: CI

# Adapted from docs/ci-cd/backend-ci-cd in the Final project repo.
# Test running is temporarily switched off below (RUN_TESTS) until the
# team actually starts writing tests — flip it to 'true' when ready.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  RUN_TESTS: 'false'

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        if: env.RUN_TESTS == 'true'
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage

      - name: Install ReportGenerator
        if: env.RUN_TESTS == 'true'
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.3.9

      - name: Merge coverage report & post summary
        if: env.RUN_TESTS == 'true'
        run: |
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;Cobertura;Html"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 14

  docker-build-check:
    name: Confirm the Docker image still builds
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
