services:
  api:
    build: .
    container_name: fridgefriend-api
    ports:
      - "5092:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    depends_on:
      flyway:
        condition: service_completed_successfully

  db:
    image: postgres:17
    container_name: fridgefriend-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the db/migrations/*.sql files against the local `db` service above.
  # For production, use docker-compose.production.yml instead (different
  # target: a managed Postgres reached over the network, not this container).
  flyway:
    image: redgate/flyway:11.12.0
    container_name: fridgefriend-flyway
    command:
      - -url=jdbc:postgresql://db:5432/${POSTGRES_DB}
      - -user=${POSTGRES_USER}
      - -password=${POSTGRES_PASSWORD}
      - -baselineOnMigrate=true
      - -connectRetries=60
      - migrate
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
